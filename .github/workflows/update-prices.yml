name: Update prices

# Every Saturday 12:00 UTC, plus a "Run workflow" button on the Actions tab.
on:
  schedule:
    - cron: "0 12 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install yfinance pandas lxml requests

      - name: Download prices
        run: python download_prices.py --out out

      # The data lives on its own branch, replaced each week (one commit),
      # so the repo history doesn't grow by a full price file every week.
      - name: Publish to the 'data' branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Prices as of $(date -u +%F)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
